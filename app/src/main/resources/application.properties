# Server configuration
server.port=8080
spring.application.name=observability-microservice

# Logging configuration
logging.level.org.personal.dynobs=INFO
logging.level.org.springframework=WARN
logging.level.org.apache=WARN

# Custom log pattern with timestamp, level, thread, logger, and message
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Log file configuration
logging.file.name=logs/observability-microservice.log
logging.file.max-size=10MB
logging.file.max-history=30

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Application info
info.app.name=Observability Microservice
info.app.description=A sample microservice for testing observability agents
info.app.version=1.0.0